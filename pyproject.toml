[project]
name = "set-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Runtime only. This is what Railway installs to run post_to_supabase.py.
#
# pandas used to be here for a single read_csv in sign_ups.py, which the
# deploy never runs - ~60MB of NumPy in every build for one line. sign_ups
# now uses the standard library's csv module instead.
dependencies = [
    "ccxt>=4.5.58",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "cryptography>=48.0.1"
]

# Test-only. Kept out of `dependencies` so the Railway build stays lean -
# the deploy runs `uv sync --no-dev` and never installs these.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Deliberately narrow. The default ruleset flags 71 issues here, and the two
# largest categories are design decisions rather than defects:
#
#   BLE001 blind-except (27)  the per-credential and per-step isolation in
#                             sync_one_credential is built on `except
#                             Exception`. One participant's broken key must
#                             not cost everyone else their run.
#   RUF013 implicit-optional  `x: int = None` in signatures, consistent with
#                             ccxt's own conventions throughout the adapters.
#
# So this selects the set that finds real bugs - undefined names, unused
# imports, syntax and logic errors - and leaves style alone. Widen it
# deliberately, not by adopting defaults.
select = ["E4", "E7", "E9", "F"]
