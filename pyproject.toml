[project]
name = "set-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.58",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "cryptography>=48.0.1"
]

# Test-only. Kept out of `dependencies` so the Railway build stays lean -
# the deploy runs `uv sync --no-dev` and never installs these.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
